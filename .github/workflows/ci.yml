name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Test playground packages
        run: npm run test:playground

      - name: Build playground frontend
        run: npm run build:playground

  e2e-demo:
    name: Demo E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run simulated demo browser tests
        id: demo
        run: npm run test:e2e:demo

      - name: Summarize simulated suite
        if: always()
        run: |
          {
            echo '### Simulated browser demo'
            echo ''
            echo '| Suite | Execution | Result |'
            echo '| --- | --- | --- |'
            echo '| test:e2e:demo (Playwright, 5 viewports, M01-M03, persistence, keyboard) | Browser simulator; static build; backend traffic blocked | ${{ steps.demo.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  playground-stack:
    name: Playground stack
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate playground Compose configuration
        run: |
          docker compose -f compose.playground.yml config --quiet
          docker compose -f compose.playground.yml --profile local config --quiet

      - name: Start packaged Demo mode
        run: npm run playground:demo

      - name: Check Demo mode boundaries
        id: demo_stack
        run: node scripts/check-playground-stack.js demo

      - name: Start packaged Local mode with the real Docker daemon
        run: npm run playground:local

      - name: Check Local mode boundaries
        id: local_stack
        run: node scripts/check-playground-stack.js local

      - name: Run real local Docker integration (missions, pipeline, recovery, security)
        id: integration
        run: npm run test:integration:local

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local Docker browser suite
        id: local_e2e
        run: npm run test:e2e:local

      - name: Upload local browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-e2e-evidence
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarize real Docker suites
        if: always()
        run: |
          {
            echo '### Packaged playground on the runner Docker daemon'
            echo ''
            echo '| Suite | Execution | Result |'
            echo '| --- | --- | --- |'
            echo '| check-playground-stack demo | Packaged portal, no runner, no socket | ${{ steps.demo_stack.outcome }} |'
            echo '| check-playground-stack local | Portal and runner, real Docker daemon | ${{ steps.local_stack.outcome }} |'
            echo '| test:integration:local | Real containers, builds, probes, recovery, security | ${{ steps.integration.outcome }} |'
            echo '| test:e2e:local | Browser against real Docker (M01-M03, S3 storage, runner outage, phone) | ${{ steps.local_e2e.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show playground logs on failure
        if: failure()
        run: docker compose -f compose.playground.yml --profile local logs --no-color

      - name: Stop playground and report owned resources
        if: always()
        run: npm run playground:down

  cloud-emulators:
    name: Cloud emulators
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run real local storage integration (pinned Moto and Azurite)
        id: cloud
        run: npm run test:integration:cloud

      - name: Summarize emulator suites
        if: always()
        run: |
          {
            echo '### Storage labs against local emulators'
            echo ''
            echo '| Suite | Execution | Result |'
            echo '| --- | --- | --- |'
            echo '| test:integration:cloud | Session-owned Moto 5.2.5, Azurite 3.37.0, and the storage workload on the runner Docker daemon | ${{ steps.cloud.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show playground logs on failure
        if: failure()
        run: docker compose -f compose.playground.yml --profile local logs --no-color

      - name: Stop playground and report owned resources
        if: always()
        run: npm run playground:down

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build Docker image
        run: docker build -t devops-playground .

      - name: Start Docker Compose stack and wait for its healthcheck
        run: docker compose up -d --build --wait --wait-timeout 60

      - name: Check API health endpoint
        run: curl --fail --silent --show-error http://localhost:3000/health

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down
