name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Test playground packages
        run: npm run test:playground

      - name: Build playground frontend
        run: npm run build:playground

  e2e-demo:
    name: Demo E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run simulated demo browser tests
        run: npm run test:e2e:demo

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  playground-stack:
    name: Playground stack
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate playground Compose configuration
        run: |
          docker compose -f compose.playground.yml config --quiet
          docker compose -f compose.playground.yml --profile local config --quiet

      - name: Start packaged Demo mode
        run: npm run playground:demo

      - name: Check Demo mode boundaries
        run: node scripts/check-playground-stack.js demo

      - name: Start packaged Local mode with the real Docker daemon
        run: npm run playground:local

      - name: Check Local mode boundaries
        run: node scripts/check-playground-stack.js local

      - name: Show playground logs on failure
        if: failure()
        run: docker compose -f compose.playground.yml --profile local logs --no-color

      - name: Stop playground and report owned resources
        if: always()
        run: npm run playground:down

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build Docker image
        run: docker build -t devops-playground .

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for API startup
        run: sleep 10

      - name: Check API health endpoint
        run: curl --fail --silent --show-error http://localhost:3000/health

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down
